name: arl-next-prod

x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "100m"
      max-file: "3"

services:
  # 前端 Nginx 容器：作为系统唯一的 HTTPS 流量网关与静态资源服务
  arl-frontend:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-frontend:latest
    container_name: arl-frontend-prod
    restart: always
    mem_reservation: 64m
    ports:
      # 映射公网 5173 端口直连 Nginx 服务
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 挂载您的 SSL 证书到容器中
      - ./ssl-certs:/certs:ro
      - ./frontend/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./frontend/default.conf.prod:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - arl-web
    networks:
      - arl-net

  # 后端 Python Web 容器 (去除了 5000/5001 端口的公网暴露)
  arl-web:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-web:latest
    container_name: arl-web-prod
    restart: always
    mem_reservation: 256m
    oom_score_adj: 0
    command: bash -c "/code/backend/start_web_prod.sh"
    working_dir: /code
    volumes:
      - ./backend/app/utils/user.py:/code/backend/app/utils/user.py
      - ./backend/app/routes/user.py:/code/backend/app/routes/user.py
      - ./backend/app/routes/__init__.py:/code/backend/app/routes/__init__.py
      - ./backend/app/routes/policy.py:/code/backend/app/routes/policy.py
      - ./backend/app/routes/task.py:/code/backend/app/routes/task.py
      - ./backend/app/routes/site.py:/code/backend/app/routes/site.py
      - ./backend/app/routes/assetSite.py:/code/backend/app/routes/assetSite.py
      - ./backend/app/routes/dictionary.py:/code/backend/app/routes/dictionary.py
      - ./backend/app/routes/brute_dict.py:/code/backend/app/routes/brute_dict.py
      - arl_screenshots:/code/backend/app/tmp_screenshot
      - arl_app_dicts:/code/backend/app/dicts
      - arl_poc_plugins:/code/backend/ARL-NPoC/xing/plugins
      - arl_poc_dicts:/code/backend/ARL-NPoC/xing/dicts
    environment:
      - TZ=Asia/Shanghai
      - DEBIAN_FRONTEND=noninteractive
      - NO_PROXY=localhost,127.0.0.1,osint-service,mongodb,rabbitmq
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    depends_on:
      - mongodb
      - rabbitmq
      - osint-service
      - arl-puppeteer
    networks:
      - arl-net

  # Puppeteer 无头浏览器渲染专属微服务 (常驻 HTTP 服务，解决 CPU 瓶颈)
  arl-puppeteer:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-puppeteer:latest
    container_name: arl-puppeteer-prod
    restart: always
    init: true
    shm_size: '512m'
    mem_reservation: 256m
    mem_limit: 768m
    oom_score_adj: 300
    command: bash -c "export NODE_PATH=/usr/local/lib/node_modules && node /code/backend/app/tools/puppeteer_server.js"
    working_dir: /code
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./backend/app/tools/puppeteer_server.js:/code/backend/app/tools/puppeteer_server.js
    networks:
      - arl-net

  # 后台扫描任务 Worker
  arl-worker:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/arl-worker:latest
    container_name: arl-worker-prod
    restart: always
    init: true
    mem_reservation: 512m
    mem_limit: 1536m
    oom_score_adj: 0
    cap_add:
      - NET_RAW
      - NET_ADMIN
    stop_grace_period: 1m
    command: bash -c "/code/backend/start_worker_prod.sh"
    working_dir: /code
    volumes:
      - ./backend/app/services/portScan.py:/code/backend/app/services/portScan.py
      - ./backend/app/tasks/domain.py:/code/backend/app/tasks/domain.py
      - ./backend/app/services/multi_level_subdomain.py:/code/backend/app/services/multi_level_subdomain.py
      - ./backend/app/services/__init__.py:/code/backend/app/services/__init__.py
      - ./backend/app/tools/domain_all:/code/backend/tools/domain_all
      - arl_screenshots:/code/backend/app/tmp_screenshot
      - arl_app_dicts:/code/backend/app/dicts
      - arl_poc_plugins:/code/backend/ARL-NPoC/xing/plugins
      - arl_poc_dicts:/code/backend/ARL-NPoC/xing/dicts
    environment:
      - TZ=Asia/Shanghai
      - DEBIAN_FRONTEND=noninteractive
      - NO_PROXY=localhost,127.0.0.1,osint-service,mongodb,rabbitmq
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    labels:
      - "autoheal=false"
    healthcheck:
      test: ["CMD-SHELL", "cd /code/backend && /code/backend/.venv-docker/bin/celery -A app.celerytask.celery inspect ping -t 10 || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 6
      start_period: 120s
    depends_on:
      - mongodb
      - rabbitmq
      - osint-service
    networks:
      - arl-net

  # MongoDB 数据库 (去除了 ports "27018:27017" 的外网暴露)
  mongodb:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/mongo:7.0
    container_name: arl-mongodb-prod
    restart: always
    mem_reservation: 512m
    oom_score_adj: -500
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      - MONGO_INITDB_DATABASE=arl
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin
      - TZ=Asia/Shanghai
    volumes:
      - mongo_data_v7:/data/db
    networks:
      - arl-net

  # RabbitMQ 队列 (去除了 ports "5673:5672" 和 "15673:15672" 的外网暴露)
  rabbitmq:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/rabbitmq:3-alpine
    container_name: arl-rabbitmq-prod
    restart: always
    mem_reservation: 128m
    oom_score_adj: -500
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
      - TZ=Asia/Shanghai
      - RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS=-rabbit consumer_timeout 2592000000
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - arl-net

  # 备案查询微服务 (去除了 ports 暴露)
  osint-service:
    <<: *default-logging
    image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/osint-service:latest
    container_name: arl-osint-service-prod
    restart: always
    mem_reservation: 64m
    networks:
      - arl-net

  # [已停用 2026-09-09] autoheal 持续 SIGKILL 崩溃循环(exit 137)，且全栈无任何容器携带 autoheal=true 标签，
  # 实际防护为零。worker 已有 restart:always + celery 子进程内存熔断兜底。启用前需先修复镜像并给受控容器打标签。
  # autoheal:
  #   <<: *default-logging
  #   image: crpi-laul1izptqrf0tkf.cn-beijing.personal.cr.aliyuncs.com/owl234-arl-prod/autoheal:latest
  #   container_name: arl-autoheal
  #   restart: always
  #   mem_reservation: 32m
  #   environment:
  #     - AUTOHEAL_CONTAINER_LABEL=autoheal
  #     - TZ=Asia/Shanghai
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   networks:
  #     - arl-net

networks:
  arl-net:
    driver: bridge

volumes:
  mongo_data_v7:
  rabbitmq_data:
  arl_screenshots:
  arl_app_dicts:
  arl_poc_plugins:
  arl_poc_dicts:
